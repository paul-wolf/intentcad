app = 'intentcad'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DEBUG = "False"
  ALLOWED_HOSTS = ".fly.dev,intentcad.fly.dev"
  CORS_ALLOWED_ORIGINS = "https://intentcad.fly.dev"
  CSRF_TRUSTED_ORIGINS = "https://intentcad.fly.dev"
  FRONTEND_URL = "https://intentcad.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[processes]
  app = "/app/start.sh"

[[vm]]
  # Dedicated (performance) CPUs: CAD/tessellation is single-threaded and
  # CPU-bound, and shared CPUs get throttled under it. 4 dedicated cores let
  # ~4 builds run in parallel; 8GB covers a warm OCP engine per web worker
  # (~0.5GB each) plus transient build memory. Tune down later if over-provisioned.
  memory = '8192mb'
  cpu_kind = 'performance'
  cpus = 4
  processes = ["app"]
