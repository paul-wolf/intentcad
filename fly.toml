app = 'intentcad'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DEBUG = "False"
  ALLOWED_HOSTS = ".fly.dev,intentcad.fly.dev"
  CORS_ALLOWED_ORIGINS = "https://intentcad.fly.dev"
  CSRF_TRUSTED_ORIGINS = "https://intentcad.fly.dev"
  FRONTEND_URL = "https://intentcad.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[processes]
  app = "/app/start.sh"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ["app"]
